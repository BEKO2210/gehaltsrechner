<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SALARY PRO | Enterprise Payroll Intelligence</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Premium Color System */
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a25;
            --bg-card: rgba(26, 26, 37, 0.6);
            --bg-glass: rgba(255, 255, 255, 0.03);
            
            /* Accent Colors - Gold/Cyan Premium */
            --accent-gold: #ffd700;
            --accent-gold-soft: rgba(255, 215, 0, 0.1);
            --accent-cyan: #00d4ff;
            --accent-cyan-soft: rgba(0, 212, 255, 0.1);
            --accent-success: #00f5a0;
            --accent-danger: #ff4757;
            --accent-warning: #ffa502;
            
            /* Text Colors */
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-tertiary: rgba(255, 255, 255, 0.5);
            --text-muted: rgba(255, 255, 255, 0.3);
            
            /* Gradients */
            --gradient-gold: linear-gradient(135deg, #ffd700 0%, #ffb700 50%, #ff8c00 100%);
            --gradient-cyan: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            --gradient-dark: linear-gradient(180deg, rgba(255,215,0,0.1) 0%, transparent 100%);
            --gradient-card: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            
            /* Shadows */
            --shadow-gold: 0 0 40px rgba(255, 215, 0, 0.15);
            --shadow-cyan: 0 0 40px rgba(0, 212, 255, 0.15);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.4);
            
            /* Spacing */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --space-2xl: 48px;
            
            /* Border Radius */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.5;
        }
        
        /* Animated Background */
        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(255, 215, 0, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(0, 212, 255, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse 50% 30% at 50% 100%, rgba(255, 140, 0, 0.05) 0%, transparent 50%);
            animation: meshMove 20s ease-in-out infinite;
        }
        
        @keyframes meshMove {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(2%, -2%) scale(1.02); }
            66% { transform: translate(-1%, 1%) scale(0.98); }
        }
        
        /* Noise Texture Overlay */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            pointer-events: none;
        }
        
        /* App Container */
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: var(--space-lg);
            padding-bottom: 120px;
        }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-md) 0;
            margin-bottom: var(--space-xl);
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }
        
        .brand-icon {
            width: 40px;
            height: 40px;
            background: var(--gradient-gold);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: var(--shadow-gold);
        }
        
        .brand-text {
            display: flex;
            flex-direction: column;
        }
        
        .brand-name {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .brand-tagline {
            font-size: 10px;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .header-actions {
            display: flex;
            gap: var(--space-sm);
        }
        
        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-full);
            background: var(--bg-glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.05);
        }
        
        /* Main Display - Hero Card */
        .hero-card {
            background: var(--gradient-card);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: var(--radius-xl);
            padding: var(--space-xl);
            margin-bottom: var(--space-xl);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-gold), var(--shadow-card);
        }
        
        .hero-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--gradient-gold);
            opacity: 0.5;
        }
        
        .hero-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-gold);
            margin-bottom: var(--space-sm);
        }
        
        .hero-amount {
            font-family: 'JetBrains Mono', monospace;
            font-size: 48px;
            font-weight: 700;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
            margin-bottom: var(--space-xs);
        }
        
        .hero-unit {
            font-size: 14px;
            color: var(--text-tertiary);
            font-weight: 500;
        }
        
        .hero-stats {
            display: flex;
            gap: var(--space-lg);
            margin-top: var(--space-lg);
            padding-top: var(--space-lg);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .hero-stat {
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
        }
        
        .hero-stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .hero-stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-secondary);
        }
        
        .hero-stat-value.positive {
            color: var(--accent-success);
        }
        
        .hero-stat-value.negative {
            color: var(--accent-danger);
        }
        
        /* Live Ticker */
        .live-section {
            background: var(--bg-card);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: var(--radius-xl);
            padding: var(--space-xl);
            margin-bottom: var(--space-xl);
            position: relative;
            overflow: hidden;
        }
        
        .live-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--gradient-cyan);
            opacity: 0.5;
        }
        
        .live-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-lg);
        }
        
        .live-title {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-success);
            border-radius: var(--radius-full);
            animation: pulse 2s infinite;
            box-shadow: 0 0 10px var(--accent-success);
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        
        .live-badge {
            font-size: 10px;
            padding: var(--space-xs) var(--space-sm);
            background: var(--accent-cyan-soft);
            color: var(--accent-cyan);
            border-radius: var(--radius-full);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .live-amount {
            font-family: 'JetBrains Mono', monospace;
            font-size: 36px;
            font-weight: 700;
            text-align: center;
            color: var(--accent-cyan);
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            margin-bottom: var(--space-lg);
        }
        
        .live-breakdown {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-md);
        }
        
        .breakdown-item {
            text-align: center;
            padding: var(--space-md);
            background: var(--bg-glass);
            border-radius: var(--radius-md);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .breakdown-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: var(--space-xs);
        }
        
        .breakdown-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 600;
        }
        
        .breakdown-value.net {
            color: var(--accent-success);
        }
        
        .breakdown-value.tax {
            color: var(--accent-danger);
        }
        
        .breakdown-value.social {
            color: var(--accent-warning);
        }
        
        /* Input Section */
        .input-section {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-xl);
            padding: var(--space-xl);
            margin-bottom: var(--space-xl);
        }
        
        .section-header {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            margin-bottom: var(--space-lg);
        }
        
        .section-icon {
            width: 32px;
            height: 32px;
            background: var(--gradient-cyan);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 700;
        }
        
        .input-group {
            margin-bottom: var(--space-lg);
        }
        
        .input-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: var(--space-sm);
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-field {
            width: 100%;
            background: var(--bg-tertiary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-lg);
            padding: var(--space-md) var(--space-lg);
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }
        
        .input-field:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px var(--accent-gold-soft);
        }
        
        .input-suffix {
            position: absolute;
            right: var(--space-lg);
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: var(--text-tertiary);
            font-weight: 600;
        }
        
        /* Toggle Group */
        .toggle-group {
            display: flex;
            background: var(--bg-tertiary);
            border-radius: var(--radius-lg);
            padding: var(--space-xs);
            margin-bottom: var(--space-lg);
        }
        
        .toggle-btn {
            flex: 1;
            padding: var(--space-md);
            border: none;
            background: transparent;
            color: var(--text-tertiary);
            font-size: 14px;
            font-weight: 600;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .toggle-btn.active {
            background: var(--gradient-gold);
            color: var(--bg-primary);
            box-shadow: var(--shadow-gold);
        }
        
        /* Slider */
        .slider-container {
            margin-bottom: var(--space-lg);
        }
        
        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-sm);
        }
        
        .slider-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-gold);
        }
        
        input[type="range"] {
            width: 100%;
            height: 6px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-full);
            outline: none;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: var(--gradient-gold);
            border-radius: var(--radius-full);
            cursor: pointer;
            box-shadow: var(--shadow-gold);
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-md);
            margin-bottom: var(--space-xl);
        }
        
        .stat-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            border-color: rgba(255, 215, 0, 0.2);
            transform: translateY(-2px);
        }
        
        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: var(--space-xs);
        }
        
        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        /* Progress Bars */
        .progress-section {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-xl);
            padding: var(--space-xl);
            margin-bottom: var(--space-xl);
        }
        
        .progress-item {
            margin-bottom: var(--space-lg);
        }
        
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-sm);
        }
        
        .progress-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }
        
        .progress-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-gold);
        }
        
        .progress-bar {
            height: 8px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-full);
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            border-radius: var(--radius-full);
            transition: width 0.5s ease;
        }
        
        .progress-fill.tax {
            background: var(--gradient-gold);
        }
        
        .progress-fill.social {
            background: var(--gradient-cyan);
        }
        
        /* Action Buttons */
        .action-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, transparent 0%, var(--bg-primary) 20%);
            padding: var(--space-lg);
            padding-bottom: calc(var(--space-lg) + env(safe-area-inset-bottom));
            display: flex;
            gap: var(--space-md);
            z-index: 100;
        }
        
        .btn {
            flex: 1;
            padding: var(--space-md) var(--space-lg);
            border: none;
            border-radius: var(--radius-lg);
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-sm);
        }
        
        .btn-primary {
            background: var(--gradient-gold);
            color: var(--bg-primary);
            box-shadow: var(--shadow-gold);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.3);
        }
        
        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }
        
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-in {
            animation: fadeIn 0.5s ease forwards;
        }
        
        /* Responsive */
        @media (min-width: 768px) {
            .app-container {
                max-width: 600px;
            }
            
            .hero-amount {
                font-size: 64px;
            }
            
            .live-amount {
                font-size: 48px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>
    <div class="noise-overlay"></div>
    
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="brand">
                <div class="brand-icon">€</div>
                <div class="brand-text">
                    <div class="brand-name">SALARY PRO</div>
                    <div class="brand-tagline">Enterprise Payroll Intelligence</div>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn">⚙️</button>
                <button class="icon-btn">👤</button>
            </div>
        </header>
        
        <!-- Hero Card -->
        <div class="hero-card animate-in">
            <div class="hero-label">Netto Verdienst</div>
            <div class="hero-amount" id="nettoDisplay">€0,00</div>
            <div class="hero-unit">pro Stunde</div>
            
            <div class="hero-stats">
                <div class="hero-stat">
                    <div class="hero-stat-label">Brutto</div>
                    <div class="hero-stat-value" id="bruttoDisplay">€0,00</div>
                </div>
                <div class="hero-stat">
                    <div class="hero-stat-label">Abgaben</div>
                    <div class="hero-stat-value negative" id="abgabenDisplay">€0,00</div>
                </div>
            </div>
        </div>
        
        <!-- Live Ticker -->
        <div class="live-section animate-in">
            <div class="live-header">
                <div class="live-title">
                    <div class="live-dot"></div>
                    Live Verdienst
                </div>
                <div class="live-badge">Real-Time</div>
            </div>
            
            <div class="live-amount" id="liveVerdienst">€0,00</div>
            
            <div class="live-breakdown">
                <div class="breakdown-item">
                    <div class="breakdown-label">Netto</div>
                    <div class="breakdown-value net" id="liveNetto">€0,00</div>
                </div>
                <div class="breakdown-item">
                    <div class="breakdown-label">Steuern</div>
                    <div class="breakdown-value tax" id="liveSteuern">-€0,00</div>
                </div>
                <div class="breakdown-item">
                    <div class="breakdown-label">Sozial</div>
                    <div class="breakdown-value social" id="liveSozial">-€0,00</div>
                </div>
            </div>
        </div>
        
        <!-- Input Section -->
        <div class="input-section animate-in">
            <div class="section-header">
                <div class="section-icon">⚙️</div>
                <div class="section-title">Konfiguration</div>
            </div>
            
            <div class="toggle-group">
                <button class="toggle-btn active" id="btnMonth" onclick="setPeriod('month')">Monat</button>
                <button class="toggle-btn" id="btnYear" onclick="setPeriod('year')">Jahr</button>
            </div>
            
            <div class="input-group">
                <label class="input-label">Brutto Gehalt</label>
                <div class="input-wrapper">
                    <input type="number" class="input-field" id="bruttoInput" value="5000" oninput="calculate()">
                    <span class="input-suffix">€</span>
                </div>
            </div>
            
            <div class="input-group">
                <label class="input-label">Stunden pro Woche</label>
                <div class="input-wrapper">
                    <input type="number" class="input-field" id="stundenInput" value="40" oninput="calculate()">
                    <span class="input-suffix">Std</span>
                </div>
            </div>
            
            <div class="slider-container">
                <div class="slider-header">
                    <label class="input-label">Steuerklasse</label>
                    <span class="slider-value" id="steuerklasseValue">I</span>
                </div>
                <input type="range" min="1" max="6" value="1" id="steuerklasseInput" oninput="updateSteuerklasse(); calculate()">
            </div>
        </div>
        
        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Pro Tag</div>
                <div class="stat-value" id="tagDisplay">€0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Pro Woche</div>
                <div class="stat-value" id="wocheDisplay">€0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Pro Monat</div>
                <div class="stat-value" id="monatDisplay">€0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Pro Jahr</div>
                <div class="stat-value" id="jahrDisplay">€0</div>
            </div>
        </div>
        
        <!-- Progress Bars -->
        <div class="progress-section">
            <div class="progress-item">
                <div class="progress-header">
                    <span class="progress-label">Lohnsteuer</span>
                    <span class="progress-value" id="steuerProzent">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill tax" id="steuerBar" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="progress-item">
                <div class="progress-header">
                    <span class="progress-label">Sozialabgaben</span>
                    <span class="progress-value" id="sozialProzent">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill social" id="sozialBar" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Action Bar -->
    <div class="action-bar">
        <button class="btn btn-secondary" onclick="resetCalculation()">
            <span>🔄</span>
            <span>Reset</span>
        </button>
        <button class="btn btn-primary" onclick="startCalculation()">
            <span>▶️</span>
            <span id="startBtnText">Start</span>
        </button>
    </div>
    
    <script>
        // State
        let isMonthly = true;
        let isRunning = false;
        let startTime = null;
        let accumulatedTime = 0;
        let timerInterval = null;
        
        // Steuerklassen
        const steuerklassen = {
            1: { faktor: 1.0, name: 'I' },
            2: { faktor: 0.9, name: 'II' },
            3: { faktor: 0.8, name: 'III' },
            4: { faktor: 1.0, name: 'IV' },
            5: { faktor: 1.2, name: 'V' },
            6: { faktor: 1.4, name: 'VI' }
        };
        
        // Sozialabgaben 2026
        const SOZIALABGABEN = {
            rentenversicherung: 0.093,
            krankenversicherung: 0.0875,
            pflegeversicherung: 0.024,
            arbeitslosenversicherung: 0.013
        };
        
        function setPeriod(period) {
            isMonthly = period === 'month';
            document.getElementById('btnMonth').classList.toggle('active', isMonthly);
            document.getElementById('btnYear').classList.toggle('active', !isMonthly);
            calculate();
        }
        
        function updateSteuerklasse() {
            const value = document.getElementById('steuerklasseInput').value;
            document.getElementById('steuerklasseValue').textContent = steuerklassen[value].name;
        }
        
        function calculate() {
            const bruttoInput = parseFloat(document.getElementById('bruttoInput').value) || 0;
            const stundenProWoche = parseFloat(document.getElementById('stundenInput').value) || 40;
            const steuerklasse = parseInt(document.getElementById('steuerklasseInput').value);
            
            const bruttoJahr = isMonthly ? bruttoInput * 12 : bruttoInput;
            const bruttoMonat = bruttoJahr / 12;
            
            const stundenProJahr = stundenProWoche * 52;
            
            const sozialabgabenJahr = bruttoJahr * 0.218;
            
            const grundfreibetrag = 12348;
            const steuerpflichtigesEinkommen = Math.max(0, bruttoJahr - grundfreibetrag);
            const steuerSaetze = { 1: 0.14, 2: 0.12, 3: 0.10, 4: 0.14, 5: 0.18, 6: 0.22 };
            const lohnsteuerJahr = steuerpflichtigesEinkommen * steuerSaetze[steuerklasse];
            
            const abgabenJahr = sozialabgabenJahr + lohnsteuerJahr;
            const nettoJahr = bruttoJahr - abgabenJahr;
            
            const nettoMonat = nettoJahr / 12;
            const lohnsteuerMonat = lohnsteuerJahr / 12;
            const sozialabgabenMonat = sozialabgabenJahr / 12;
            
            const bruttoStunde = bruttoJahr / stundenProJahr;
            const nettoStunde = nettoJahr / stundenProJahr;
            const abgabenStunde = abgabenJahr / stundenProJahr;
            
            window.currentRates = {
                nettoStunde,
                bruttoStunde,
                abgabenStunde,
                lohnsteuerStunde: lohnsteuerJahr / stundenProJahr,
                sozialStunde: sozialabgabenJahr / stundenProJahr
            };
            
            document.getElementById('bruttoDisplay').textContent = formatCurrency(bruttoStunde);
            document.getElementById('nettoDisplay').textContent = formatCurrency(nettoStunde);
            document.getElementById('abgabenDisplay').textContent = formatCurrency(abgabenStunde);
            
            document.getElementById('tagDisplay').textContent = formatCurrency(nettoStunde * 8);
            document.getElementById('wocheDisplay').textContent = formatCurrency(nettoStunde * stundenProWoche);
            document.getElementById('monatDisplay').textContent = formatCurrency(nettoMonat);
            document.getElementById('jahrDisplay').textContent = formatCurrency(nettoJahr);
            
            const steuerAnteil = ((lohnsteuerJahr / bruttoJahr) * 100).toFixed(1);
            const sozialAnteil = ((sozialabgabenJahr / bruttoJahr) * 100).toFixed(1);
            
            document.getElementById('steuerProzent').textContent = steuerAnteil + '%';
            document.getElementById('steuerBar').style.width = Math.min(steuerAnteil, 100) + '%';
            
            document.getElementById('sozialProzent').textContent = sozialAnteil + '%';
            document.getElementById('sozialBar').style.width = Math.min(sozialAnteil, 100) + '%';
        }
        
        function formatCurrency(value) {
            return '€' + value.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        }
        
        function updateLiveTicker() {
            if (!isRunning || !window.currentRates) return;
            
            const { nettoStunde, lohnsteuerStunde, sozialStunde, bruttoStunde } = window.currentRates;
            
            const currentSession = (Date.now() - startTime) / 1000 / 60 / 60;
            const totalHours = accumulatedTime + currentSession;
            
            const liveNetto = nettoStunde * totalHours;
            const liveSteuern = lohnsteuerStunde * totalHours;
            const liveSozial = sozialStunde * totalHours;
            const liveBrutto = bruttoStunde * totalHours;
            
            document.getElementById('liveVerdienst').textContent = formatCurrency(liveBrutto);
            document.getElementById('liveNetto').textContent = formatCurrency(liveNetto);
            document.getElementById('liveSteuern').textContent = '-' + formatCurrency(liveSteuern);
            document.getElementById('liveSozial').textContent = '-' + formatCurrency(liveSozial);
        }
        
        function startCalculation() {
            if (isRunning) {
                isRunning = false;
                accumulatedTime += (Date.now() - startTime) / 1000 / 60 / 60;
                document.getElementById('startBtnText').textContent = 'Start';
                clearInterval(timerInterval);
            } else {
                isRunning = true;
                startTime = Date.now();
                document.getElementById('startBtnText').textContent = 'Pause';
                timerInterval = setInterval(updateLiveTicker, 100);
            }
        }
        
        function resetCalculation() {
            isRunning = false;
            accumulatedTime = 0;
            startTime = null;
            clearInterval(timerInterval);
            
            document.getElementById('startBtnText').textContent = 'Start';
            document.getElementById('liveVerdienst').textContent = '€0,00';
            document.getElementById('liveNetto').textContent = '€0,00';
            document.getElementById('liveSteuern').textContent = '-€0,00';
            document.getElementById('liveSozial').textContent = '-€0,00';
        }
        
        // Initial
        calculate();
    </script>
</body>
</html>
